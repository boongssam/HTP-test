<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTP 심리 분석 시스템</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-badge">AI Analysis</div>
        <h1>HTP 심리 분석 시스템</h1>
        <p>학생들의 집-나무-사람(HTP) 그림을 기반으로 한 정서 상태 분석 리포트</p>
      </header>
      
      <main class="container">
        <!-- 상단 컨트롤 -->
        <div class="top-controls">
          <button id="viewRecordsBtn" class="btn-secondary small-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            이전 분석 기록
          </button>
        </div>

        <!-- 업로드 섹션 -->
        <section class="card upload-section">
          <h2>새 분석 시작</h2>
          <div class="input-group">
            <label for="studentName">대상자 이름</label>
            <input type="text" id="studentName" placeholder="이름을 입력하세요 (예: 홍길동)" required />
          </div>
          <div class="input-group file-upload-group">
            <label for="imageUpload" class="file-upload-label">
              <div class="upload-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              </div>
              <span id="uploadText">클릭하여 이미지 업로드 (PNG, JPG)</span>
            </label>
            <input type="file" id="imageUpload" accept="image/*" />
          </div>
          <div class="preview-container hidden" id="previewContainer">
            <div class="image-wrapper">
              <img id="imagePreview" alt="업로드된 그림 미리보기" />
              <div class="image-overlay">
                <button id="removeImageBtn" class="btn-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
            </div>
          </div>
          
          <button id="analyzeBtn" class="btn-primary" disabled>
            분석 실행
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </section>

        <!-- 로딩 애니메이션 -->
        <div id="loadingOverlay" class="hidden">
          <div class="loader"></div>
          <p>AI가 그림의 특성을 분석하고 있습니다<br><span>잠시만 기다려주세요</span></p>
        </div>

        <!-- 결과 섹션 -->
        <section id="resultSection" class="card result-section hidden">
          <div class="result-header">
            <div class="result-title-group">
              <span class="status-badge">분석 완료</span>
              <h2><span id="resultStudentName"></span> 학생 분석 리포트</h2>
            </div>
            <p class="date" id="resultDate"></p>
          </div>
          <div class="result-content" id="resultContent">
            <!-- 분석 결과가 여기에 표시됩니다. -->
          </div>
          <div class="result-actions">
            <button id="saveDbBtn" class="btn-primary outline">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
              결과 저장하기
            </button>
            <p id="saveStatus" class="status-msg hidden"></p>
          </div>
        </section>

        <!-- 기록 보기 모달 (숨김 기본값) -->
        <section id="recordsSection" class="card records-section hidden">
          <div class="records-header">
            <h2>분석 기록</h2>
            <button id="closeRecordsBtn" class="btn-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div id="recordsList" class="records-list">
            <!-- 기록들이 여기에 표시됩니다 -->
          </div>
        </section>
      </main>
      
      <footer>
        <p>본 시스템의 분석 결과는 교육적 참고 자료이며, 전문적인 심리 진단을 대체할 수 없습니다.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
